name: Release macOS DMG

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    name: DMG (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      RUSTUP_TOOLCHAIN: stable
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build DMG
        run: sh script/bundle.sh --dmg
      - name: Upload DMG to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          dmg="dist/Usenv-macos-${ARCH}.dmg"
          mv "dist/Usenv-dev-macos-${ARCH}.dmg" "$dmg"
          gh release upload --repo "$GITHUB_REPOSITORY" --clobber -- "$RELEASE_TAG" "$dmg"
